# Four services from one image. The three agents are genuinely separate servers
# that do not import each other; the console reaches them over HTTP by name, the
# same way the Showcase Orchestrator will.
#
#   docker compose -f docker/compose.yml up --build
#   open http://localhost:8080
#
# You only need the one for your own domain. Start it alone with:
#
#   docker compose -f docker/compose.yml up charging

name: smac

x-agent: &agent
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment: &keys
    # Your agent runs on the Claude API. With no key set the tools still return
    # their computed facts; only the written commentary is skipped.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    # Only needed for `run_eval.py --wandb`. Your own key, your own project.
    WANDB_API_KEY: ${WANDB_API_KEY:-}
    WANDB_PROJECT: ${WANDB_PROJECT:-}
    WANDB_ENTITY: ${WANDB_ENTITY:-}
  volumes:
    # Keeps the 28 MB GTFS download and the geocoding cache across restarts.
    - cache:/app/src/.cache
    # Token, latency and cost per call - the dataset behind the
    # cost-effectiveness question. On the host, because a container is a
    # disposable thing and this data is not. Each service writes its own file
    # (USAGE_LOG below): one shared file would mix four domains' calls together
    # with nothing in the record to tell them apart.
    - ../usage:/app/usage

x-probe: &probe
  test: ["CMD", "python", "-c", "import socket,os;socket.create_connection(('127.0.0.1',int(os.environ['PORT'])),2).close()"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  charging:
    <<: *agent
    command: python /app/src/agents/charging.py
    ports: ["8000:8000"]
    healthcheck: *probe
    environment:
      <<: *keys
      PORT: "8000"
      USAGE_LOG: /app/usage/usage.charging.jsonl

  public_transport:
    <<: *agent
    command: python /app/src/agents/public_transport.py
    ports: ["8001:8001"]
    healthcheck: *probe
    environment:
      <<: *keys
      PORT: "8001"
      USAGE_LOG: /app/usage/usage.public_transport.jsonl

  policy:
    <<: *agent
    command: python /app/src/agents/policy.py
    ports: ["8002:8002"]
    healthcheck: *probe
    environment:
      <<: *keys
      PORT: "8002"
      USAGE_LOG: /app/usage/usage.policy.jsonl

  network:
    <<: *agent
    command: python /app/src/agents/network.py
    ports: ["8003:8003"]
    healthcheck: *probe
    environment:
      <<: *keys
      PORT: "8003"
      USAGE_LOG: /app/usage/usage.network.jsonl
    volumes:
      - cache:/app/src/.cache
      - ../usage:/app/usage
      # The pinned network and timetable the evaluation's ground truth was
      # measured on (src/pin_snapshot.py). Read-only, so nothing inside the
      # container can change what its answers are judged against. With the
      # folder empty the agent falls back to building its own from the cache.
      - ../snapshot:/app/snapshot:ro

  console:
    <<: *agent
    command: python /app/application/ui.py
    ports: ["8080:8080"]
    environment:
      <<: *keys
      PORT: "8080"
      CHARGING_URL: http://charging:8000/mcp
      PT_URL: http://public_transport:8001/mcp
      POLICY_URL: http://policy:8002/mcp
      NETWORK_URL: http://network:8003/mcp
    # Wait until each agent answers, so the console never opens showing agents
    # offline. network's healthcheck can take longer than the others on a cold
    # start (first Overpass fetch), which is why its startup pre-warms the
    # graph before the server even binds its port - see agents/network.py.
    depends_on:
      charging: {condition: service_healthy}
      public_transport: {condition: service_healthy}
      policy: {condition: service_healthy}
      network: {condition: service_healthy}

volumes:
  cache:
