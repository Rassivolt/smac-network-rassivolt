[project]
name = "smac-agent"
version = "0.1.0"
description = "REIT7820 Smart Mobility Agent Collective - student agent"
requires-python = ">=3.10"

dependencies = [
    # Pinned on purpose. mcp 2.x is the only line that speaks MCP protocol
    # revision 2025-11-25, which this course requires (spec §2, decision D6).
    # The previous line (1.9.x) tops out at 2025-03-26 and cannot be used.
    # Do not run `pip install -U mcp` during semester. Pinned exactly to the
    # version the handshake (v1.0.1) passed on - the same pin as the Dockerfile.
    "mcp==2.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only the evaluation scripts log to W&B, and they import it when they need it.
# Kept out of the default install so the UQCloud zone (1 GB, which installs
# exactly this file) installs only what the agent runs on. The Dockerfile
# installs it, so the container's evaluation is unaffected.
eval = ["wandb>=0.18"]


[tool.uv]
package = false

